#   rest of the suite needs network, hardware, or services the container does
#   not have, it is too slow to run inside the verifier timeout, or the
#   remaining tests are known to be flaky. Reject an assertion that the suite
#   is wide enough, with no count and no reason it cannot grow.
#
# Remove '# ' from the answer block below and fill in reason.
# Uncomment 'checks:' above if needed. For an existing checks mapping,
# place the answer inside it; replace 'checks: {}' with 'checks:'.
