version: 1
checks:
  cyberswe/probe-altsolve:
    reason: >-
      The probe's alternative (returning forbidden()/403 instead of
      unauthorized()/401) is not equally valid for this codebase: I grepped
      every call site and found unauthorized()/401 is used at all 107
      existing ownership/permission-check guards across the [websiteId]-scoped
      routes (the canViewWebsite/canViewAuthenticatedWebsite/canDeleteWebsite
      family), with zero exceptions. forbidden()/403 exists in this codebase
      but is used only 3 times, and never for this class of check -- only for
      unrelated policy denials (IP blocklist in send/record, org-level 2FA
      requirement in 2fa/disable). A fix that returns 403 here breaks a
      100%-consistent codebase convention specific to this exact check, which
      is why the minimal/correct fix (see reasoning.txt) is the literal
      restoration of the original line -- same helper, same status code --
      not a plausible-looking substitute. The status-code assertion is not
      the only gate in the fail_to_pass tests: both also assert the sink
      (getSessionReplays) is never called, so any fix that closes the
      cross-tenant data leak by gating the sink at all, but does so with a
      401, still passes; only a fix that deviates from the codebase's own
      established status-code convention for this check family is rejected,
      which is intentional, not overspecification.

# cyberswe/pass-to-pass-target — what a good answer says:
